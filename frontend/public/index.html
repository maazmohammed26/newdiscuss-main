    <body>
        <script>
            (function() {
                try {
                    var theme = localStorage.getItem('discuss_theme') || 'light';
                    if (theme === 'discuss-light' || theme === 'discuss-black' || theme === 'discuss-retro') {
                        theme = (theme === 'discuss-black') ? 'dark' : 'light';
                        localStorage.setItem('discuss_theme', theme);
                    }
                    var html = document.documentElement;
                    if (theme === 'dark') {
                        html.classList.add('dark');
                        html.style.setProperty('--splash-bg', '#000000');
                        html.style.setProperty('--splash-text', '#FFFFFF');
                    } else {
                        html.classList.remove('dark');
                        html.style.setProperty('--splash-bg', '#FFFFFF');
                        html.style.setProperty('--splash-text', '#262626');
                    }
                } catch(e) {}
            })();
        </script>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root">
            <style>
                .splash-screen {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    height: 100vh;
                    background-color: var(--splash-bg, #FFFFFF);
                    color: var(--splash-text, #262626);
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                }
                .splash-logo {
                    font-family: 'Grand Hotel', cursive, -apple-system, sans-serif;
                    font-size: 42px;
                    font-weight: 400;
                    letter-spacing: 0.5px;
                    line-height: 1.1;
                }
                .splash-spinner {
                    width: 32px;
                    height: 32px;
                    border: 2.5px solid rgba(0, 149, 246, 0.15);
                    border-top-color: #0095F6;
                    border-radius: 50%;
                    animation: splash-spin 0.8s linear infinite;
                    margin-top: 24px;
                }
                @keyframes splash-spin {
                    to { transform: rotate(360deg); }
                }
            </style>
            <div class="splash-screen">
                <div class="splash-logo">Discuss</div>
                <div class="splash-spinner"></div>
